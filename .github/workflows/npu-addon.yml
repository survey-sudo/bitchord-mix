name: NPU add-on v73

# Builds BitChord's own Hexagon V73 add-on (Part B4.3) and publishes it as
# release `npu-v73-N` with an `npu-addons.json` manifest. Manual only:
# there is nothing to build until the QAIRT license review stages the
# payload (see npu-addon/v73/README.md).
#
# The module is a standalone Gradle project (NOT in the root
# settings.gradle.kts), built with the repo-root wrapper into this dir.

on:
  workflow_dispatch:
    inputs:
      n:
        description: "Add-on revision N (release becomes npu-v73-N)"
        required: false
        default: "1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  # Pinned to the same toolchain as the app builds (Android CI / Release).
  ANDROID_COMPILE_SDK: "36"
  ANDROID_BUILD_TOOLS: "36.0.0"
  ANDROID_NDK: "27.2.12479018"
  ANDROID_CMAKE: "3.22.1"
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3g -Dorg.gradle.daemon=false"

jobs:
  build:
    name: Build npu-v73 add-on (arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Validate scaffold
        run: |
          set -euo pipefail
          M=npu-addon/v73/src/main/AndroidManifest.xml
          grep -q 'package="com.music.bitchord.loopfix.npu.v73"' "$M" \
            && echo "ok manifest package"
          test -f npu-addon/v73/build.gradle.kts && echo "ok build.gradle.kts"
          test -f npu-addon/v73/settings.gradle.kts && echo "ok settings.gradle.kts"
          test -f npu-addon/v73/README.md && echo "ok README.md"
          test -f npu-addon/v73/src/main/jniLibs/arm64-v8a/.gitkeep && echo "ok jniLibs/arm64-v8a"
          test -f npu-addon/v73/src/main/assets/.gitkeep && echo "ok assets"
          # The add-on must never be registered in the app build.
          if grep -q 'npu-addon' settings.gradle.kts; then
            echo "::error::npu-addon/v73 must stay unregistered in settings.gradle.kts"
            exit 1
          fi

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk \
                      /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Install SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-$ANDROID_COMPILE_SDK" \
            "build-tools;$ANDROID_BUILD_TOOLS" \
            "ndk;$ANDROID_NDK" \
            "cmake;$ANDROID_CMAKE"

      # Optional signing, same secrets as the app release. The add-on is
      # signed with the fork key so the app can install it on top of the
      # signed app APK (same signer).
      - name: Configure signing (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "No signing secrets configured — the add-on will be unsigned."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > npu-addon/v73/bitchord-loopfix.jks
          {
            echo "storeFile=bitchord-loopfix.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > npu-addon/v73/keystore.properties
          chmod 600 npu-addon/v73/bitchord-loopfix.jks npu-addon/v73/keystore.properties

      - name: assembleRelease (standalone project)
        run: ./gradlew -p npu-addon/v73 :assembleRelease --max-workers=2 --no-daemon --stacktrace

      - name: Generate npu-addons.json manifest
        env:
          ADDON_N: ${{ inputs.n }}
        run: |
          set -euo pipefail
          APK=$(ls npu-addon/v73/build/outputs/apk/release/*.apk | head -1)
          echo "apk=$APK"
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          BYTES=$(stat -c %s "$APK")
          {
            echo "{"
            echo '  "schema": 1,'
            echo '  "addons": ['
            echo "    {"
            echo '      "id": "bitchord-npu-v73",'
            echo '      "package": "com.music.bitchord.loopfix.npu.v73",'
            echo "      \"revision\": ${ADDON_N:-1},"
            echo '      "abi": "arm64-v8a",'
            echo "      \"release\": \"npu-v73-${ADDON_N:-1}\","
            echo "      \"file\": \"$(basename "$APK")\","
            echo "      \"bytes\": ${BYTES},"
            echo "      \"sha256\": \"${SHA}\","
            echo '      "models": ['
            echo '        { "file": "nirovi_qnn.onnx", "bytes": null, "sha256": null, "checksumStatus": "addon-verified-pending" },'
            echo '        { "file": "syvenu_qnn.onnx", "bytes": null, "sha256": null, "checksumStatus": "addon-verified-pending" }'
            echo "      ]"
            echo "    }"
            echo "  ]"
            echo "}"
          } > npu-addons.json
          cat npu-addons.json

      - name: Publish npu-v73 release
        env:
          GH_TOKEN: ${{ github.token }}
          ADDON_N: ${{ inputs.n }}
        run: |
          set -euo pipefail
          APK=$(ls npu-addon/v73/build/outputs/apk/release/*.apk | head -1)
          TAG="npu-v73-${ADDON_N:-1}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" npu-addons.json --clobber
          else
            gh release create "$TAG" "$APK" npu-addons.json \
              --title "BitChord NPU add-on v73 (rev ${ADDON_N:-1})" \
              --notes "Hexagon V73 add-on for BitChord (Part B4.3). Installs as com.music.bitchord.loopfix.npu.v73; the app verifies it via ModelRegistry + self-test before any ep=QNN use."
          fi

      - name: Upload build diagnostics (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: npu-build-diagnostics
          path: |
            npu-addon/v73/build/outputs/logs/
            npu-addon/v73/build/reports/
          if-no-files-found: ignore
          retention-days: 14
