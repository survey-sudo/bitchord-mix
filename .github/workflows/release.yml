name: Release

# One release pipeline (Part B11.1 / checklist C3): CI gates -> signed APK ->
# changelog from conventional commits -> GitHub Release with the APK,
# models.json and the release's quality HTML.
#
# Triggered manually (workflow_dispatch, optional `tag` and `draft` inputs)
# or by pushing a release tag `ae3-*` (e.g. `ae3-1.10-djmix53`).
#
# The job is fail-closed. Signing is NOT optional: every publish-capable run,
# draft included, needs all four secrets (KEYSTORE_BASE64 /
# KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD), and it fails before any heavy
# work when one is missing or the key material is unusable. There is no
# unsigned release path. The full tools/audit-apk.sh release audit is mandatory
# before publishing, and the quality HTML for this build
# (docs/quality/AE3-<build>.html) must exist and be non-empty before upload.
#
# The quality report is transported, not re-judged: mixq/audition/perf/soak
# gates stay on the devbox (docs/QUALITY.md), and a missing report blocks the
# release instead of being skipped or synthesized.
#
# Heavy work (soak, real-corpus mixq, audition) stays on the devbox; its
# results are linked from the release notes, not rebuilt here.

on:
  push:
    tags:
      - "ae3-*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (blank = ae3-manual-<run number>)"
        required: false
        default: ""
      draft:
        description: "Create the release as a draft"
        required: false
        default: "false"
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  # Pinned to the toolchain the release was built and verified with on
  # bk-android. Do not float these: a different NDK changes native output.
  ANDROID_COMPILE_SDK: "36"
  ANDROID_BUILD_TOOLS: "36.0.0"
  ANDROID_NDK: "27.2.12479018"
  ANDROID_CMAKE: "3.22.1"
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3g -Dorg.gradle.daemon=false"

jobs:
  release:
    name: Release APK (arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The tag becomes a git ref, a `gh release` argument and a regex. It is
      # passed through env (never interpolated into the script) so an input
      # cannot inject shell; tools/release/release-gates.sh then restricts it to
      # the `ae3-*` shape. workflow_dispatch inputs are trusted only as far as
      # the validation makes them.
      - name: Resolve release tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-}"
          if [ -z "$TAG" ]; then
            if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
              TAG="${GITHUB_REF_NAME}"
            else
              TAG="ae3-manual-${GITHUB_RUN_NUMBER}"
            fi
          fi
          TAG="$TAG" bash tools/release/release-gates.sh validate-tag
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG"

      # Everything below publishes or feeds a publish, so the signing gate runs
      # first: a missing/empty secret or unusable key material stops the run
      # here, before the probes and the Gradle build spend 100+ minutes.
      #
      # The emptiness check lives in the shell on purpose: GitHub does not
      # allow the `secrets` context inside a step-level `if:`, so an `if` here
      # would evaluate to false and the check would silently never run.
      - name: Require release signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: bash tools/release/release-gates.sh require-signing

      # The quality report for this exact build must already be in the tree.
      # Checking it now fails fast; the publish step re-checks and uploads the
      # very file selected here. Presence is not a metrics verdict — the mixq /
      # audition gates that produced the report ran upstream (docs/QUALITY.md).
      - name: Require release quality report
        id: quality
        run: bash tools/release/release-gates.sh require-quality

      # --- CI gates (B11.1): core tests, native probes, synthetic render ---

      - name: Native probes (deterministic FP flags, ADR 0008)
        run: |
          set -euo pipefail
          # ADR 0008: -fno-fast-math -ffp-contract=off -Wall -Wextra so the
          # host CLI renders bit-identically to the device renderer (B1.3).
          CXXFLAGS="-std=c++17 -O2 -fno-fast-math -ffp-contract=off -Wall -Wextra"
          g++ $CXXFLAGS -I native -I native/third_party \
              native/loopmix/loop_mix_renderer.cpp \
              native/loopmix/loop_mix_renderer_ab_main.cpp \
              -o /tmp/loop_mix_renderer_ab_main
          /tmp/loop_mix_renderer_ab_main --selftest
          /tmp/loop_mix_renderer_ab_main --reverb-stop-probe
          /tmp/loop_mix_renderer_ab_main --loop-domain-probe
          /tmp/loop_mix_renderer_ab_main --lp-bypass-probe
          /tmp/loop_mix_renderer_ab_main --v2-probe
          echo "--- phrase isolator ---"
          g++ $CXXFLAGS -I native/loopmix \
              native/loopmix/phrase_isolator_test.cpp \
              -o /tmp/phrase_isolator_test
          /tmp/phrase_isolator_test
          echo "--- startup probe ---"
          g++ $CXXFLAGS -I native -I native/third_party \
              native/loopmix/loop_mix_renderer.cpp \
              native/loopmix/loop_mix_renderer_startup_probe.cpp \
              -o /tmp/loopmix_startup_probe
          /tmp/loopmix_startup_probe

      - name: Native probes under ASan/UBSan
        run: |
          set -euo pipefail
          CXXFLAGS="-std=c++17 -O1 -g -fsanitize=address,undefined -fno-fast-math -ffp-contract=off -Wall -Wextra"
          g++ $CXXFLAGS -I native -I native/third_party \
              native/loopmix/loop_mix_renderer.cpp \
              native/loopmix/loop_mix_renderer_ab_main.cpp \
              -o /tmp/loop_mix_renderer_ab_main_asan
          /tmp/loop_mix_renderer_ab_main_asan --selftest
          /tmp/loop_mix_renderer_ab_main_asan --reverb-stop-probe
          /tmp/loop_mix_renderer_ab_main_asan --loop-domain-probe
          /tmp/loop_mix_renderer_ab_main_asan --lp-bypass-probe
          /tmp/loop_mix_renderer_ab_main_asan --v2-probe
          g++ $CXXFLAGS -I native/loopmix \
              native/loopmix/phrase_isolator_test.cpp \
              -o /tmp/phrase_isolator_test_asan
          /tmp/phrase_isolator_test_asan
          g++ $CXXFLAGS -I native -I native/third_party \
              native/loopmix/loop_mix_renderer.cpp \
              native/loopmix/loop_mix_renderer_startup_probe.cpp \
              -o /tmp/loopmix_startup_probe_asan
          /tmp/loopmix_startup_probe_asan

      - name: Synthetic host render + mixq gate (B6.6)
        run: |
          set -euo pipefail
          python3 -m pip install --quiet numpy
          CXXFLAGS="-std=c++17 -O2 -fno-fast-math -ffp-contract=off -Wall -Wextra"
          g++ $CXXFLAGS -I native -I native/third_party \
              native/loopmix/loop_mix_renderer.cpp \
              native/loopmix/loop_mix_renderer_ab_main.cpp \
              -o /tmp/loop_mix_renderer_ab_main
          rm -rf /tmp/synthetic-pairs /tmp/synthetic-renders
          python3 tools/audition/generate_synthetic_pairs.py \
              --out /tmp/synthetic-pairs --recipes S1,C2,F1
          mkdir -p /tmp/synthetic-renders
          for script in /tmp/synthetic-pairs/pair*_*.script.json; do
            base="$(basename "$script" .script.json)"
            echo "render $base"
            /tmp/loop_mix_renderer_ab_main --render "$script" --out "/tmp/synthetic-renders/${base}.wav"
            cp "/tmp/synthetic-pairs/${base}.meta.json" "/tmp/synthetic-renders/${base}.meta.json"
          done
          python3 tools/mixq/mixq.py check /tmp/synthetic-renders \
              -o /tmp/synthetic-renders/mixq-results.json

      - name: Fork hooks + @AudioThread alloc lint (B10/B13)
        run: |
          set -euo pipefail
          bash tools/upstream-sync/hooks-check.sh
          python3 tools/check_audiothread_alloc.py

      # The runner image is ~14 GB free and the NDK alone is ~2 GB.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk \
                      /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Install SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-$ANDROID_COMPILE_SDK" \
            "build-tools;$ANDROID_BUILD_TOOLS" \
            "ndk;$ANDROID_NDK" \
            "cmake;$ANDROID_CMAKE"

      - name: djmix-core jvmTest
        run: ./gradlew :djmix-core:jvmTest --max-workers=2 --no-daemon --stacktrace

      # Signing material was validated and written 0600 by "Require release
      # signing secrets" above; nothing optional happens here. The build signs
      # through keystore.properties, and a build that ends up unsigned fails in
      # the audit step rather than shipping.
      - name: Configure signing
        run: |
          set -euo pipefail
          ks=keystore.properties
          [ -f "$ks" ] || { echo "ERROR: $ks missing; the signing gate did not run" >&2; exit 1; }
          mode=$(stat -c '%a' "$ks")
          [ "$mode" = "600" ] || { echo "ERROR: $ks is mode $mode, expected 600" >&2; exit 1; }
          store=$(sed -n 's/^storeFile=//p' "$ks")
          [ -n "$store" ] && [ -f "$store" ] || { echo "ERROR: keystore named by $ks is not on disk" >&2; exit 1; }
          mode=$(stat -c '%a' "$store")
          [ "$mode" = "600" ] || { echo "ERROR: keystore $store is mode $mode, expected 600" >&2; exit 1; }
          echo "signing configured from $store"

      - name: Pre-build disk check
        run: df -h

      - name: assembleProdRelease
        run: ./gradlew :app:assembleProdRelease -Pbitchord.bundleWear=false --max-workers=2 --no-daemon --stacktrace

      # Mandatory full release audit: identity, ORT/model assets, signature
      # scheme/certs, 16 KiB alignment. No structural-only mode and no accepted
      # exit codes here — any failure is a failed release. select-artifacts
      # requires the quality report too, and refuses 0 or >1 APKs plus an
      # unsigned file name, instead of picking "the first" match.
      - name: Audit APK
        id: artifacts
        run: |
          set -euo pipefail
          : "${GITHUB_OUTPUT:?GITHUB_OUTPUT is required}"
          release_env=$(mktemp)
          trap 'rm -f "$release_env"' EXIT
          env GITHUB_OUTPUT="$release_env" bash tools/release/release-gates.sh select-artifacts
          cat "$release_env" >> "$GITHUB_OUTPUT"
          # Values are simple paths/hashes; split on the first '=' only.
          while IFS='=' read -r key value; do
            [ -n "$key" ] || continue
            printf -v "$key" '%s' "$value"
          done < "$release_env"
          export AUDIT_EXPECTED_VERSION_NAME="$version_name"
          export AUDIT_EXPECTED_VERSION_CODE="$version_code"
          bash tools/audit-apk.sh "$apk"
          {
            echo "### APK audit"
            echo ""
            echo "- apk: \`$(basename "$apk")\`"
            echo "- size: $(stat -c %s "$apk") bytes"
            echo "- sha256: \`$(sha256sum "$apk" | cut -d' ' -f1)\`"
            echo "- versionName: \`$version_name\` / versionCode $version_code"
            echo "- quality report: \`$(basename "$quality_html")\` (sha256 \`$quality_sha256\`)"
          } >> "$GITHUB_STEP_SUMMARY"

      # --- Changelog from conventional commits since previous tag (B11.1) ---

      - name: Generate release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          QUALITY_NAME: ${{ steps.quality.outputs.quality_html }}
        run: |
          set -euo pipefail
          PREV=$(git tag --list 'ae3-*' --sort=-v:refname | grep -vxF -- "$TAG" | head -1 || true)
          if [ -n "$PREV" ] && git rev-parse "$PREV" >/dev/null 2>&1; then
            RANGE="${PREV}..HEAD"
          else
            RANGE="HEAD"
          fi
          {
            echo "## BitChord ${TAG}"
            echo ""
            echo "AE 3.0.0 — see CHANGELOG.md for the full owner-facing notes."
            echo ""
            echo "### Changes since ${PREV:-the first release}"
            echo ""
            git log "$RANGE" --pretty=format:'- %s (%h)' --no-merges | sed 's/^- /- /' || true
            echo ""
            echo "### Downloads"
            echo ""
            echo "- The signed release APK below (install with \`adb install -r\`; never uninstall)."
            echo "- \`models.json\` — the bundled model registry (B4.1)."
            echo "- \`$(basename "$QUALITY_NAME")\` — the quality report for this build (from \`${QUALITY_NAME}\`)."
            echo ""
            echo "The report records the devbox mixq/audition gates; attaching it is not a claim that they passed."
          } > release-notes.md
          cat release-notes.md

      # --- Publish the GitHub Release with the audited APK + models.json + report ---

      # Uploads exactly the files audited above. The SHA-256 check re-verifies
      # that nothing replaced the APK or the report between the audit and the
      # upload, so the release cannot carry a different artifact than the one
      # that passed. There is no fallback file selection and no skip path.
      - name: Create GitHub Release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          DRAFT: ${{ inputs.draft }}
          APK: ${{ steps.artifacts.outputs.apk }}
          APK_SHA256: ${{ steps.artifacts.outputs.apk_sha256 }}
          QUALITY_HTML: ${{ steps.artifacts.outputs.quality_html }}
          QUALITY_SHA256: ${{ steps.artifacts.outputs.quality_sha256 }}
          MODELS_JSON: app/src/main/assets/models.json
        run: |
          set -euo pipefail
          [ -n "$APK" ] || { echo "ERROR: no audited APK path from the audit step" >&2; exit 1; }
          [ -n "$QUALITY_HTML" ] || { echo "ERROR: no audited quality report from the audit step" >&2; exit 1; }
          [ -f "$MODELS_JSON" ] || { echo "ERROR: $MODELS_JSON missing" >&2; exit 1; }
          bash tools/release/release-gates.sh verify-sha "$APK" "$APK_SHA256" "audited APK"
          bash tools/release/release-gates.sh verify-sha "$QUALITY_HTML" "$QUALITY_SHA256" "quality report"
          FILES=("$APK" "$MODELS_JSON" "$QUALITY_HTML")
          echo "Uploading: ${FILES[*]}"
          # Tag is validated (^ae3-[A-Za-z0-9][A-Za-z0-9._-]*$) before it reaches
          # here and is passed through env, so it is a plain ref argument.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${FILES[@]}" --clobber
          else
            if [ "$DRAFT" = "true" ]; then
              gh release create "$TAG" "${FILES[@]}" --draft \
                --title "BitChord ${TAG}" --notes-file release-notes.md
            else
              gh release create "$TAG" "${FILES[@]}" \
                --title "BitChord ${TAG}" --notes-file release-notes.md
            fi
          fi
          {
            echo "### Release ${TAG}"
            echo ""
            echo "| field | value |"
            echo "|---|---|"
            echo "| apk | \`$(basename "$APK")\` |"
            echo "| apk sha256 | \`$(sha256sum "$APK" | cut -d' ' -f1)\` |"
            echo "| apk size | $(stat -c %s "$APK") bytes |"
            echo "| quality report | \`$(basename "$QUALITY_HTML")\` |"
            echo "| quality report sha256 | \`$(sha256sum "$QUALITY_HTML" | cut -d' ' -f1)\` |"
            echo "| models.json | \`$(sha256sum "$MODELS_JSON" | cut -d' ' -f1)\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build diagnostics (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: |
            app/build/outputs/logs/
            build/reports/
            app/build/reports/
          if-no-files-found: ignore
          retention-days: 14
