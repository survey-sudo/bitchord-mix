name: Release

# One release pipeline (Part B11.1): CI gates -> signed APK -> changelog
# from conventional commits -> GitHub Release with the APK, models.json and
# the quality HTML (when present under docs/quality/).
#
# Triggered manually (workflow_dispatch, optional `tag` and `draft` inputs)
# or by pushing a release tag `ae3-*` (e.g. `ae3-1.10-djmix53`).
# Signing is optional: with the four signing secrets configured
# (KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD) the
# release is signed; without them the release carries the unsigned APK and
# the full audit is skipped with a warning.
#
# Heavy work (soak, real-corpus mixq, audition) stays on the devbox; its
# results are linked from the release notes, not rebuilt here.

on:
  push:
    tags:
      - "ae3-*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (blank = ae3-manual-<run number>)"
        required: false
        default: ""
      draft:
        description: "Create the release as a draft"
        required: false
        default: "false"
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  # Pinned to the toolchain the release was built and verified with on
  # bk-android. Do not float these: a different NDK changes native output.
  ANDROID_COMPILE_SDK: "36"
  ANDROID_BUILD_TOOLS: "36.0.0"
  ANDROID_NDK: "27.2.12479018"
  ANDROID_CMAKE: "3.22.1"
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3g -Dorg.gradle.daemon=false"

jobs:
  release:
    name: Release APK (arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: tag
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
              TAG="${GITHUB_REF_NAME}"
            else
              TAG="ae3-manual-${GITHUB_RUN_NUMBER}"
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG"

      # --- CI gates (B11.1): core tests, native probes, synthetic render ---

      - name: Native probes (deterministic FP flags, ADR 0008)
        run: |
          set -euo pipefail
          # ADR 0008: -fno-fast-math -ffp-contract=off -Wall -Wextra so the
          # host CLI renders bit-identically to the device renderer (B1.3).
          CXXFLAGS="-std=c++17 -O2 -fno-fast-math -ffp-contract=off -Wall -Wextra"
          g++ $CXXFLAGS -I native -I native/third_party \
              native/loopmix/loop_mix_renderer.cpp \
              native/loopmix/loop_mix_renderer_ab_main.cpp \
              -o /tmp/loop_mix_renderer_ab_main
          /tmp/loop_mix_renderer_ab_main --selftest
          /tmp/loop_mix_renderer_ab_main --reverb-stop-probe
          /tmp/loop_mix_renderer_ab_main --loop-domain-probe
          /tmp/loop_mix_renderer_ab_main --lp-bypass-probe
          /tmp/loop_mix_renderer_ab_main --v2-probe
          echo "--- phrase isolator ---"
          g++ $CXXFLAGS -I native/loopmix \
              native/loopmix/phrase_isolator_test.cpp \
              -o /tmp/phrase_isolator_test
          /tmp/phrase_isolator_test
          echo "--- startup probe ---"
          g++ $CXXFLAGS -I native -I native/third_party \
              native/loopmix/loop_mix_renderer.cpp \
              native/loopmix/loop_mix_renderer_startup_probe.cpp \
              -o /tmp/loopmix_startup_probe
          /tmp/loopmix_startup_probe

      - name: Native probes under ASan/UBSan
        run: |
          set -euo pipefail
          CXXFLAGS="-std=c++17 -O1 -g -fsanitize=address,undefined -fno-fast-math -ffp-contract=off -Wall -Wextra"
          g++ $CXXFLAGS -I native -I native/third_party \
              native/loopmix/loop_mix_renderer.cpp \
              native/loopmix/loop_mix_renderer_ab_main.cpp \
              -o /tmp/loop_mix_renderer_ab_main_asan
          /tmp/loop_mix_renderer_ab_main_asan --selftest
          /tmp/loop_mix_renderer_ab_main_asan --reverb-stop-probe
          /tmp/loop_mix_renderer_ab_main_asan --loop-domain-probe
          /tmp/loop_mix_renderer_ab_main_asan --lp-bypass-probe
          /tmp/loop_mix_renderer_ab_main_asan --v2-probe
          g++ $CXXFLAGS -I native/loopmix \
              native/loopmix/phrase_isolator_test.cpp \
              -o /tmp/phrase_isolator_test_asan
          /tmp/phrase_isolator_test_asan
          g++ $CXXFLAGS -I native -I native/third_party \
              native/loopmix/loop_mix_renderer.cpp \
              native/loopmix/loop_mix_renderer_startup_probe.cpp \
              -o /tmp/loopmix_startup_probe_asan
          /tmp/loopmix_startup_probe_asan

      - name: Synthetic host render + mixq gate (B6.6)
        run: |
          set -euo pipefail
          python3 -m pip install --quiet numpy
          CXXFLAGS="-std=c++17 -O2 -fno-fast-math -ffp-contract=off -Wall -Wextra"
          g++ $CXXFLAGS -I native -I native/third_party \
              native/loopmix/loop_mix_renderer.cpp \
              native/loopmix/loop_mix_renderer_ab_main.cpp \
              -o /tmp/loop_mix_renderer_ab_main
          rm -rf /tmp/synthetic-pairs /tmp/synthetic-renders
          python3 tools/audition/generate_synthetic_pairs.py \
              --out /tmp/synthetic-pairs --recipes S1,C2,F1
          mkdir -p /tmp/synthetic-renders
          for script in /tmp/synthetic-pairs/pair*_*.script.json; do
            base="$(basename "$script" .script.json)"
            echo "render $base"
            /tmp/loop_mix_renderer_ab_main --render "$script" --out "/tmp/synthetic-renders/${base}.wav"
            cp "/tmp/synthetic-pairs/${base}.meta.json" "/tmp/synthetic-renders/${base}.meta.json"
          done
          python3 tools/mixq/mixq.py check /tmp/synthetic-renders \
              -o /tmp/synthetic-renders/mixq-results.json

      - name: Fork hooks + @AudioThread alloc lint (B10/B13)
        run: |
          set -euo pipefail
          bash tools/upstream-sync/hooks-check.sh
          python3 tools/check_audiothread_alloc.py

      # The runner image is ~14 GB free and the NDK alone is ~2 GB.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk \
                      /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Install SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-$ANDROID_COMPILE_SDK" \
            "build-tools;$ANDROID_BUILD_TOOLS" \
            "ndk;$ANDROID_NDK" \
            "cmake;$ANDROID_CMAKE"

      - name: djmix-core jvmTest
        run: ./gradlew :djmix-core:jvmTest --max-workers=2 --no-daemon --stacktrace

      # Optional signing. Absent secrets leave the release unsigned rather
      # than failing, because signingConfig is null when the keystore is
      # missing.
      #
      # The emptiness check lives in the shell on purpose: GitHub does not
      # allow the `secrets` context inside a step-level `if:`, so an `if`
      # here would evaluate to false and the signing step would silently
      # never run.
      - name: Configure signing (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "No signing secrets configured — the release will be unsigned."
            echo "Add KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD"
            echo "as repository secrets to produce a signed, installable APK."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > bitchord-loopfix.jks
          {
            echo "storeFile=bitchord-loopfix.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
          chmod 600 bitchord-loopfix.jks keystore.properties

      - name: Pre-build disk check
        run: df -h

      - name: assembleProdRelease
        run: ./gradlew :app:assembleProdRelease -Pbitchord.bundleWear=false --max-workers=2 --no-daemon --stacktrace

      - name: Audit APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          APK=$(ls app/build/outputs/apk/prod/release/*.apk | head -1)
          echo "apk=$APK"
          stat -c '%s bytes' "$APK"
          sha256sum "$APK"
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            # Signed release: full audit (identity, ORT/model assets,
            # signature scheme/certs, 16 KiB alignment).
            export AUDIT_EXPECTED_VERSION_NAME="1.10-djmix53"
            export AUDIT_EXPECTED_VERSION_CODE="95"
            bash tools/audit-apk.sh "$APK"
          else
            echo "::warning::unsigned build — running structural checks only"
            bash tools/audit-apk.sh --structural-only "$APK" || test "$?" = "3"
          fi

      # --- Changelog from conventional commits since previous tag (B11.1) ---

      - name: Generate release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          PREV=$(git tag --list 'ae3-*' --sort=-v:refname | grep -v "^${TAG}$" | head -1 || true)
          if [ -n "$PREV" ] && git rev-parse "$PREV" >/dev/null 2>&1; then
            RANGE="${PREV}..HEAD"
          else
            RANGE="HEAD"
          fi
          {
            echo "## BitChord ${TAG}"
            echo ""
            echo "AE 3.0.0 — see CHANGELOG.md for the full owner-facing notes."
            echo ""
            echo "### Changes since ${PREV:-the first release}"
            echo ""
            git log "$RANGE" --pretty=format:'- %s (%h)' --no-merges | sed 's/^- /- /' || true
            echo ""
            echo "### Downloads"
            echo ""
            echo "- The release APK below (install with \`adb install -r\`; never uninstall)."
            echo "- \`models.json\` — the bundled model registry (B4.1)."
            echo "- Quality HTML under \`docs/quality/\` (when present in this tree)."
          } > release-notes.md
          cat release-notes.md

      # --- Publish the GitHub Release with APK + models.json + quality ---

      - name: Create GitHub Release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          DRAFT: ${{ inputs.draft }}
        run: |
          set -euo pipefail
          APK=$(ls app/build/outputs/apk/prod/release/*.apk | head -1)
          FILES=("$APK" "app/src/main/assets/models.json")
          shopt -s nullglob
          QUALITY=(docs/quality/*.html)
          shopt -u nullglob
          if [ "${#QUALITY[@]}" -gt 0 ]; then
            FILES+=("${QUALITY[@]}")
          else
            echo "No docs/quality/*.html present — skipping quality HTML."
          fi
          echo "Uploading: ${FILES[*]}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${FILES[@]}" --clobber
          else
            if [ "$DRAFT" = "true" ]; then
              gh release create "$TAG" "${FILES[@]}" --draft \
                --title "BitChord ${TAG}" --notes-file release-notes.md
            else
              gh release create "$TAG" "${FILES[@]}" \
                --title "BitChord ${TAG}" --notes-file release-notes.md
            fi
          fi
          {
            echo "### Release ${TAG}"
            echo ""
            echo "| field | value |"
            echo "|---|---|"
            echo "| apk | \`$(basename "$APK")\` |"
            echo "| size | $(stat -c %s "$APK") bytes |"
            echo "| sha256 | \`$(sha256sum "$APK" | cut -d' ' -f1)\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build diagnostics (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: |
            app/build/outputs/logs/
            build/reports/
            app/build/reports/
          if-no-files-found: ignore
          retention-days: 14
