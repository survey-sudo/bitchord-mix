name: Android CI

# Upstream shipped a workflow that triggers on `main` and runs a bare
# `assembleProdRelease`. This fork's branch is `master`, the phone build needs
# `-Pbitchord.bundleWear=false`, and the exact NDK/CMake versions the release
# was verified against are not on the runner image. All three are fixed here.
#
# Signing is deliberately optional: app/build.gradle.kts nulls the release
# signingConfig when the keystore is absent, so this workflow produces
# app-release-unsigned.apk with no secrets configured. Add the four signing
# secrets and it produces the signed APK instead, with no workflow change.

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned to the toolchain the release was built and verified with on
  # bk-android. Do not float these: a different NDK changes native output.
  ANDROID_COMPILE_SDK: "36"
  ANDROID_BUILD_TOOLS: "36.0.0"
  ANDROID_NDK: "27.2.12479018"
  ANDROID_CMAKE: "3.22.1"
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3g -Dorg.gradle.daemon=false"

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # Native checks first: they need nothing but g++ and take seconds, so a
      # broken DSP translation unit fails before we spend 8 minutes installing
      # an SDK. This job exists because no gate ever called the native success
      # path — a deterministic null store shipped in vc73/vc74 and every gate
      # stayed green, since both JVM tests short-circuit before the patched code.
      - name: Native analyzer tests
        run: |
          set -euo pipefail
          g++ -std=c++17 -O2 -I native/analyzer \
              native/analyzer/vocal_spectrogram_test.cpp \
              native/analyzer/vocal_spectrogram.cpp \
              -o /tmp/vocal_spectrogram_test
          /tmp/vocal_spectrogram_test
          echo "--- window path calibration ---"
          g++ -std=c++17 -O2 -I native/analyzer \
              native/analyzer/window_calibration.cpp \
              native/analyzer/vocal_spectrogram.cpp \
              -o /tmp/window_calibration
          /tmp/window_calibration
          echo "--- same test under ASan/UBSan ---"
          g++ -std=c++17 -O1 -g -fsanitize=address,undefined -I native/analyzer \
              native/analyzer/vocal_spectrogram_test.cpp \
              native/analyzer/vocal_spectrogram.cpp \
              -o /tmp/vocal_spectrogram_test_asan
          /tmp/vocal_spectrogram_test_asan
          echo "--- loopmix renderer A/B selftest ---"
          if [ -f native/loopmix/loop_mix_renderer_ab_main.cpp ]; then
            g++ -std=c++17 -O2 -I native -I native/third_party \
                native/loopmix/loop_mix_renderer.cpp \
                native/loopmix/loop_mix_renderer_ab_main.cpp \
                -o /tmp/loop_mix_renderer_ab_main
            /tmp/loop_mix_renderer_ab_main --selftest
            /tmp/loop_mix_renderer_ab_main --reverb-stop-probe
            /tmp/loop_mix_renderer_ab_main --loop-domain-probe
          else
            echo "loop_mix_renderer_ab_main.cpp not present yet — skipping (Lane B)."
          fi
          echo "--- phrase isolator / bass-swap ramp test ---"
          g++ -std=c++17 -O2 native/loopmix/phrase_isolator_test.cpp \
              -o /tmp/phrase_isolator_test
          /tmp/phrase_isolator_test
          echo "--- loopmix held-deck startup probe ---"
          # This probe's main() takes NO arguments: --selftest and
          # --loop-domain-probe belong to loop_mix_renderer_ab_main above.
          g++ -std=c++17 -O2 -I native -I native/third_party \
              native/loopmix/loop_mix_renderer.cpp \
              native/loopmix/loop_mix_renderer_startup_probe.cpp \
              -o /tmp/loopmix_startup_probe
          /tmp/loopmix_startup_probe
          echo "--- pitch-stretch bench (self-contained, <1 s) ---"
          g++ -std=c++17 -O2 -I native -I native/third_party \
              native/stretch/pitch_stretch.cpp \
              native/stretch/bench_main.cpp \
              -o /tmp/stretch_bench
          /tmp/stretch_bench

      # The runner image is ~14 GB free and the NDK alone is ~2 GB.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk \
                      /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Install SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-$ANDROID_COMPILE_SDK" \
            "build-tools;$ANDROID_BUILD_TOOLS" \
            "ndk;$ANDROID_NDK" \
            "cmake;$ANDROID_CMAKE"

      - name: shared jvmTest
        run: ./gradlew :shared:jvmTest --max-workers=2 --no-daemon --stacktrace

      - name: app unit tests
        run: ./gradlew :app:testProdDebugUnitTest --max-workers=2 --no-daemon --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            shared/build/reports/tests/
            app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 14

  release:
    name: Release APK (arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # Non-blocking until two consecutive green runs confirm stability: run
    # 43847603785 lost runner communication at 51m1s during assembleProdRelease
    # (Unit tests passed in 8m24s). Reduced heap (-Xmx3g) and
    # --max-workers=2 --no-daemon leave headroom on 7 GiB runners.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      # Gated here too, not just in the test job: this job can be dispatched on
      # its own (workflow_dispatch), and an artifact must never exist unless the
      # native success path actually ran.
      - name: Native analyzer tests
        run: |
          set -euo pipefail
          g++ -std=c++17 -O2 -I native/analyzer \
              native/analyzer/vocal_spectrogram_test.cpp \
              native/analyzer/vocal_spectrogram.cpp \
              -o /tmp/vocal_spectrogram_test
          /tmp/vocal_spectrogram_test
          echo "--- loopmix renderer A/B selftest ---"
          if [ -f native/loopmix/loop_mix_renderer_ab_main.cpp ]; then
            g++ -std=c++17 -O2 -I native -I native/third_party \
                native/loopmix/loop_mix_renderer.cpp \
                native/loopmix/loop_mix_renderer_ab_main.cpp \
                -o /tmp/loop_mix_renderer_ab_main
            /tmp/loop_mix_renderer_ab_main --selftest
            /tmp/loop_mix_renderer_ab_main --reverb-stop-probe
            /tmp/loop_mix_renderer_ab_main --loop-domain-probe
          else
            echo "loop_mix_renderer_ab_main.cpp not present yet — skipping (Lane B)."
          fi
          echo "--- phrase isolator / bass-swap ramp test ---"
          g++ -std=c++17 -O2 native/loopmix/phrase_isolator_test.cpp \
              -o /tmp/phrase_isolator_test
          /tmp/phrase_isolator_test
          echo "--- loopmix held-deck startup probe ---"
          # This probe's main() takes NO arguments: --selftest and
          # --loop-domain-probe belong to loop_mix_renderer_ab_main above.
          g++ -std=c++17 -O2 -I native -I native/third_party \
              native/loopmix/loop_mix_renderer.cpp \
              native/loopmix/loop_mix_renderer_startup_probe.cpp \
              -o /tmp/loopmix_startup_probe
          /tmp/loopmix_startup_probe
          echo "--- pitch-stretch bench (self-contained, <1 s) ---"
          g++ -std=c++17 -O2 -I native -I native/third_party \
              native/stretch/pitch_stretch.cpp \
              native/stretch/bench_main.cpp \
              -o /tmp/stretch_bench
          /tmp/stretch_bench

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk \
                      /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Install SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-$ANDROID_COMPILE_SDK" \
            "build-tools;$ANDROID_BUILD_TOOLS" \
            "ndk;$ANDROID_NDK" \
            "cmake;$ANDROID_CMAKE"

      # Optional signing. Absent secrets leave the release unsigned rather than
      # failing, because signingConfig is null when the keystore is missing.
      #
      # The emptiness check lives in the shell on purpose: GitHub does not allow
      # the `secrets` context inside a step-level `if:`, so an `if` here would
      # evaluate to false and the signing step would silently never run.
      - name: Configure signing (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "No signing secrets configured — the release will be unsigned."
            echo "Add KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD"
            echo "as repository secrets to produce a signed, installable APK."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > bitchord-loopfix.jks
          {
            echo "storeFile=bitchord-loopfix.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
          chmod 600 bitchord-loopfix.jks keystore.properties

      - name: Pre-build disk check
        run: df -h

      - name: assembleProdRelease
        run: ./gradlew :app:assembleProdRelease -Pbitchord.bundleWear=false --max-workers=2 --no-daemon --stacktrace

      - name: Audit APK
        run: |
          set -euo pipefail
          APK=$(ls app/build/outputs/apk/prod/release/*.apk | head -1)
          echo "apk=$APK"
          stat -c '%s bytes' "$APK"
          sha256sum "$APK"
          # sed, not head: with `pipefail` aapt2 gets SIGPIPE when head exits
          # early, and the audit step would fail after a successful build.
          "$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS/aapt2" dump badging "$APK" | sed -n '1,2p'
          echo "--- onnxruntime copies (expect 1) ---"
          unzip -l "$APK" | grep -c 'libonnxruntime.so'
          echo "--- QNN/HTP libs (expect 0) ---"
          unzip -l "$APK" | grep -icE 'libQnn|libHtp' || true
          echo "--- native libs ---"
          unzip -l "$APK" | grep 'libbitchord_' || true
          {
            echo "### Release APK"
            echo ""
            echo "| field | value |"
            echo "|---|---|"
            echo "| file | \`$(basename "$APK")\` |"
            echo "| size | $(stat -c %s "$APK") bytes |"
            echo "| sha256 | \`$(sha256sum "$APK" | cut -d' ' -f1)\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bitchord-prod-arm64
          path: app/build/outputs/apk/prod/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build diagnostics (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: |
            app/build/outputs/logs/
            build/reports/
            app/build/reports/
          if-no-files-found: ignore
          retention-days: 14
